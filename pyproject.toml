[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "optcurves"
version = "0.3.0"
description = "Convexity of gradient-descent optimization curves: consecutive violations (PEP study, exact certificates, Lean proofs) and the exact one-violation threshold and worst case for strongly convex functions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "gradient descent",
    "optimization curves",
    "convex optimization",
    "strong convexity",
    "performance estimation",
    "PEPit",
    "semidefinite programming",
    "exact certificates",
    "counterexamples",
    "Lean 4",
    "formal verification",
]
dependencies = [
    "PEPit>=0.5.1",
    "cvxpy>=1.9",
    "clarabel>=0.11",
    "scs>=3.2",
    "sympy>=1.14",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/AbdulazizHGA/optcurves"
Documentation = "https://github.com/AbdulazizHGA/optcurves#readme"
Issues = "https://github.com/AbdulazizHGA/optcurves/issues"
Citation = "https://github.com/AbdulazizHGA/optcurves/blob/main/CITATION.cff"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
